name: Hourly copy

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview copies without modifying the destination
        type: boolean
        default: true
      detailed_logs:
        description: Show detailed rclone output in public Actions logs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rclone-remote-sync
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
    steps:
      - name: Validate secrets
        env:
          TELDRIVE_ENV: ${{ secrets.TELDRIVE_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG" || { echo 'Missing RCLONE_CONFIG secret'; exit 1; }
          test -n "$TELDRIVE_ENV" || { echo 'Missing TELDRIVE_ENV secret'; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/rclone-sync"
          printf '%s\n' "$TELDRIVE_ENV" > "$RUNNER_TEMP/rclone-sync/teldrive.env"

      - name: Install forked rclone
        env:
          RCLONE_DOWNLOAD_URL: ${{ secrets.RCLONE_DOWNLOAD_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RCLONE_DOWNLOAD_URL" || { echo 'Missing RCLONE_DOWNLOAD_URL secret'; exit 1; }
          install_dir="$RUNNER_TEMP/rclone-bin"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "$RCLONE_DOWNLOAD_URL" \
            --output "$install_dir/rclone.tar.gz"
          tar --no-same-owner -xzf "$install_dir/rclone.tar.gz" -C "$install_dir" \
            --strip-components=1 rclone-v1.75.2-linux-amd64/rclone
          chmod 755 "$install_dir/rclone"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/rclone" version

      - name: Start Teldrive v2 on localhost
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/tgdrive/teldrive:2
          docker run --detach --name teldrive-sync --network host \
            --env-file "$RUNNER_TEMP/rclone-sync/teldrive.env" \
            ghcr.io/tgdrive/teldrive:2 > /dev/null
          # Any HTTP response confirms the listener is up; authentication is checked by rclone.
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null --max-time 3 http://localhost:8080/; then exit 0; fi
            if test "$(docker inspect --format '{{.State.Running}}' teldrive-sync)" != true; then
              echo 'Teldrive exited; verify TELDRIVE_ENV and database connectivity'; exit 1
            fi
            sleep 2
          done
          echo 'Teldrive did not listen on localhost:8080'; exit 1

      - name: Copy library then assets
        timeout-minutes: 115
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          DETAILED_LOGS: ${{ github.event_name == 'workflow_dispatch' && inputs.detailed_logs }}
        shell: bash
        run: |
          set -euo pipefail
          common=(--fast-list --check-first --order-by modtime,desc --teldrive-api-host http://localhost:8080
            --cutoff-mode HARD --retries 1
            --stats 1m --stats-one-line)
          if test "$DETAILED_LOGS" = true; then
            common+=(--log-level DEBUG)
          else
            common+=(--log-level ERROR)
          fi
          if test "$DRY_RUN" = true; then common+=(--dry-run); fi
          deadline=$((SECONDS + 110 * 60))
          copy_folder() {
            local folder="$1" transfers="$2" remaining status=0
            shift 2
            remaining=$((deadline - SECONDS))
            if ((remaining <= 0)); then
              echo "$folder skipped: shared copy duration reached." >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            echo "Copying $folder with $transfers transfers."
            if test "$DETAILED_LOGS" = true; then
              set +e
              timeout --signal=TERM --kill-after=30s "$((remaining + 30))s" \
                rclone copy "tdrive:$folder" "gpix:$folder" --transfers "$transfers" \
                --max-duration "${remaining}s" "${common[@]}" "$@" 2>&1 \
                | tee "$RUNNER_TEMP/rclone-sync/$folder.log"
              status=${PIPESTATUS[0]}
              set -e
            else
              timeout --signal=TERM --kill-after=30s "$((remaining + 30))s" \
                rclone copy "tdrive:$folder" "gpix:$folder" --transfers "$transfers" \
                --max-duration "${remaining}s" "${common[@]}" "$@" \
                > "$RUNNER_TEMP/rclone-sync/$folder.log" 2>&1 || status=$?
            fi
            echo "$folder exit status: $status" >> "$GITHUB_STEP_SUMMARY"
            case "$status" in
              0) echo "$folder copy completed." ;;
              10) echo "$folder duration reached; remaining files will be checked next run." ;;
              *) echo "$folder copy failed (exit $status)."; return "$status" ;;
            esac
          }
          # Sequential copies: library must finish before assets starts.
          copy_folder library 7
          copy_folder assets 4 --tpslimit 1 --tpslimit-burst 1

      - name: Clean up
        if: always()
        shell: bash
        run: |
          docker rm --force teldrive-sync > /dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/rclone-sync" "$RUNNER_TEMP/rclone-bin"
